name: Fehlerbericht
description: Fehler bei Installation, Einrichtung oder Leistungsregelung
body:
  - type: input
    id: core
    attributes:
      label: Home Assistant Core Version
      placeholder: 2026.10.x
    validations:
      required: true
  - type: input
    id: hacs
    attributes:
      label: HACS Version / Installationsweg
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Erwartetes und beobachtetes Verhalten
      description: Bitte ohne Zugangsdaten, Tokens oder öffentliche IP-Adressen
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevante Logauszüge
      description: Bitte anonymisieren
